<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101a31"><title>QuizLens · AI 学习识题</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#eaf0ff;background:#0b1221}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 0%,#1b3555 0%,#0b1221 58%)}main{max-width:650px;margin:auto;padding:26px 18px 90px}.head{display:flex;align-items:center;gap:12px;margin-bottom:28px}.logo{background:#59b8ec;color:#081b30;padding:12px;border-radius:15px;font-weight:900;font-size:22px}.brand{font-size:24px;font-weight:800;letter-spacing:-.5px}.sub{font-size:13px;color:#a5b3c9;margin-top:4px}.pill{margin-left:auto;background:#213e4b;color:#92e3d3;padding:7px 10px;border-radius:30px;font-size:12px}h1{font-size:28px;line-height:1.3;margin:0 0 10px}p{color:#aebcd0;line-height:1.65}.panel{border:1px solid #2a3b53;background:#111e31e8;border-radius:22px;padding:18px;margin-top:20px;box-shadow:0 16px 36px #0002}.camera{background:#172a40;border:1px dashed #53718b;border-radius:16px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;gap:12px;position:relative}.camera svg{width:54px;opacity:.85}.camera img{width:100%;max-height:360px;object-fit:contain;display:none}.camera span{color:#b7c9db;font-size:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}button,.upload{border:0;cursor:pointer;border-radius:13px;padding:14px 12px;font-size:15px;font-weight:700;text-align:center}button.primary{background:#61c2ed;color:#072036}button.secondary,.upload{background:#283b52;color:#e7f1fa}button:disabled{opacity:.45;cursor:not-allowed}input[type=file]{display:none}.mode{display:flex;gap:10px;margin:18px 0 6px}.mode label{flex:1;border:1px solid #30465d;padding:11px;border-radius:12px;font-size:14px;text-align:center;cursor:pointer}.mode input{accent-color:#6ecbef}.run{width:100%;margin-top:14px}.status{font-size:13px;color:#a5b3c9;margin-top:12px;min-height:20px}.result{white-space:pre-wrap;line-height:1.8;font-size:15px;color:#e7eff9;overflow-wrap:anywhere}.hidden{display:none}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.row h2{font-size:18px;margin:0}.small{font-size:12px;color:#9eacc0}.history-item{width:100%;display:block;text-align:left;margin-top:9px;background:#1d3046;color:#e8f0fa;font-weight:500}.notice{font-size:12px;margin-top:18px}footer{font-size:12px;color:#8294aa;text-align:center;margin-top:30px}
</style></head><body><main>
<div class="head"><div class="logo">Q</div><div><div class="brand">QuizLens</div><div class="sub">随手拍题 · 深入理解</div></div><div class="pill">Study Mode</div></div>
<h1>拍下题目，学会解法。</h1><p>适合 BPS5231、神经网络、建筑环境等课程的课后练习。拍照或上传题目截图，获得中文讲解。</p>
<section class="panel"><div class="camera" id="preview"><svg viewBox="0 0 24 24" fill="none" stroke="#9fc8e6" stroke-width="1.5"><path d="M4 7h4l2-2h4l2 2h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span id="placeholder">选择照片或拍摄纸质题目</span><img id="photo" alt="题目预览"></div>
<div class="actions"><label class="upload" for="cameraInput">📷 拍摄题目</label><label class="upload" for="galleryInput">▧ 上传截图</label></div><input id="cameraInput" type="file" accept="image/*" capture="environment"><input id="galleryInput" type="file" accept="image/*">
<div class="mode"><label><input type="radio" name="mode" value="study" checked> 查看答案与解析</label><label><input type="radio" name="mode" value="practice"> 先给解题提示</label></div>
<button class="primary run" id="analyze" disabled>开始 AI 分析 →</button><div class="status" id="status" role="status" aria-live="polite">请先选择一张图片。</div></section>
<section class="panel hidden" id="resultPanel"><div class="row"><h2>AI 学习解析</h2><button class="secondary" id="copy" style="padding:9px 13px;font-size:13px">复制</button></div><div class="result" id="result"></div><p class="notice">AI 可能识别或推理错误，请核对题干与课程资料。</p></section>
<section class="panel"><div class="row"><h2>最近的复习记录</h2><button class="secondary" id="clear" style="padding:8px 11px;font-size:12px">清空</button></div><div id="history"><p class="small">暂无记录。记录仅保存在当前浏览器中。</p></div></section>
<footer>QuizLens · 课后学习辅助工具 · 请遵守课程考试规则</footer>
</main><script>
const $=id=>document.getElementById(id);let imageData='';let history=[];try{history=JSON.parse(localStorage.getItem('quizlens_history')||'[]')}catch{};
function showHistory(){const root=$('history');root.replaceChildren();if(!history.length){const p=document.createElement('p');p.className='small';p.textContent='暂无记录。记录仅保存在当前浏览器中。';root.append(p);return}history.forEach((item)=>{const b=document.createElement('button');b.className='history-item';b.textContent=`${item.date} · ${item.text.slice(0,62).replace(/\n/g,' ')}…`;b.onclick=()=>showResult(item.text);root.append(b)})}
function showResult(text){$('result').textContent=text;$('resultPanel').classList.remove('hidden');$('resultPanel').scrollIntoView({behavior:'smooth',block:'start'})}
async function loadFile(file){if(!file)return;if(!file.type.startsWith('image/')){$('status').textContent='请选择图片文件';return}if(file.size>18*1024*1024){$('status').textContent='图片超过18MB，请先压缩';return}try{const bitmap=await createImageBitmap(file);const max=1600,scale=Math.min(1,max/Math.max(bitmap.width,bitmap.height));const canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);imageData=canvas.toDataURL('image/jpeg',.83);bitmap.close();$('photo').src=imageData;$('photo').style.display='block';$('preview').querySelector('svg').style.display='none';$('placeholder').style.display='none';$('analyze').disabled=false;$('status').textContent='图片已准备好，可以开始分析。'}catch(e){$('status').textContent='无法读取图片，请尝试其他格式。'}}
$('cameraInput').onchange=e=>loadFile(e.target.files[0]);$('galleryInput').onchange=e=>loadFile(e.target.files[0]);
$('analyze').onclick=async()=>{if(!imageData)return;const button=$('analyze');button.disabled=true;button.textContent='正在识别与分析…';$('status').textContent='正在处理图片，通常需要几秒到几十秒。';try{const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),60000);let response;try{response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:imageData,mode:document.querySelector('input[name=mode]:checked').value}),signal:controller.signal})}finally{clearTimeout(timeout)}const data=await response.json();if(!response.ok)throw Error(data.error||'服务器错误');showResult(data.result);history.unshift({date:new Date().toLocaleString('zh-CN'),text:data.result});history=history.slice(0,12);try{localStorage.setItem('quizlens_history',JSON.stringify(history))}catch{}showHistory();$('status').textContent='分析完成。'}catch(e){$('status').textContent='分析失败：'+(e.name==='AbortError'?'请求超时，请重试':e.message)}}finally{button.disabled=false;button.textContent='开始 AI 分析 →'}};
$('copy').onclick=()=>navigator.clipboard.writeText($('result').textContent).then(()=>{$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制',1600)}).catch(()=>{$('copy').textContent='复制失败'});
$('clear').onclick=()=>{history=[];localStorage.removeItem('quizlens_history');showHistory()};showHistory();
</script></body></html>
